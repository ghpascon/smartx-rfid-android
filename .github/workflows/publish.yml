name: Publish

# Publica no GitHub Packages quando uma tag vX.Y.Z é criada (scripts/commit.sh faz isso).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GITHUB_ACTOR: ${{ github.actor }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4

      - name: Publicar SDKs de fabricantes
        # Versões já publicadas são rejeitadas pelo GitHub Packages; isso não deve quebrar o release.
        continue-on-error: true
        run: ./gradlew :vendor-sdks:publishAllPublicationsToGitHubPackagesRepository

      - name: Testes
        run: ./gradlew :smartx-rfid:testDebugUnitTest

      - name: Publicar biblioteca
        run: ./gradlew :smartx-rfid:publishReleasePublicationToGitHubPackagesRepository
