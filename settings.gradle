// Biblioteca SmartX RFID para Android.
// Toda configuração (versão, coordenadas Maven, SDKs de fabricantes) vem de config.json.

pluginManagement {
    repositories {
        google {
            content {
                includeGroupByRegex("com\\.android.*")
                includeGroupByRegex("com\\.google.*")
                includeGroupByRegex("androidx.*")
            }
        }
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // SDKs de fabricantes (AAR/JAR) empacotados como artefatos Maven.
        // Gerado por scripts/publish_sdks.sh (vendor-sdks/repo).
        maven {
            name = "vendorSdks"
            url = uri("vendor-sdks/repo")
        }
    }
}

rootProject.name = "smartx-rfid-android"
include ':smartx-rfid'
include ':vendor-sdks'
